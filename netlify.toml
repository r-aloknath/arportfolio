[build]
command = "npm run build"
# Do NOT set publish directory - let @netlify/plugin-nextjs manage it

[[plugins]]
package = "@netlify/plugin-nextjs"

# Environment variables for production
[context.production]
environment = { NEXT_PUBLIC_SITE_URL = "https://alokonar.in" }

# Environment variables for deploy preview
[context.deploy-preview]
environment = { NEXT_PUBLIC_SITE_URL = "https://$DEPLOY_PRIME_URL" }
